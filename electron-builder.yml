# LinOS MCP: Windows portable ZIP only.
# No NSIS, MSI, installer/uninstaller, registry modification or auto-upgrade.
# Each device creates its own per-user state and must explicitly authorize access.
appId: com.linos.mcp.portable
productName: LinOS MCP
copyright: Copyright © 2026 LinOS
artifactName: LinOS-MCP-Portable-${version}-${arch}.${ext}

directories:
  output: release-portable
  buildResources: assets

files:
  - package.json
  - dist/**
  - "!dist/**/*.test.js"
  - "!dist/**/*.spec.js"
  - "!dist/**/__tests__/**"
  - runtime/package.json
  - runtime/dist/**/*
  - runtime/node_modules/**/*
  # 构建期依赖不得进包：runtime 只需要 express 运行时即可
  - "!runtime/node_modules/typescript/**"
  - "!runtime/node_modules/@types/**"
  - "!runtime/node_modules/.bin/**"
  # 开发/文档/示例/类型声明不进包（保留 LICENSE 与 package.json）
  - "!runtime/node_modules/**/{test,tests,__tests__,docs,doc,example,examples,benchmark,benchmarks}/**"
  - "!runtime/node_modules/**/*.d.ts"
  - "!runtime/node_modules/**/*.d.mts"
  - "!runtime/node_modules/**/*.map"
  - "!runtime/node_modules/**/*.md"
  - assets/**
  - "!**/*.map"
  - extension/**

extraResources:
  - from: scripts/dpapi-helper.ps1
    to: scripts/dpapi-helper.ps1
  - from: scripts/portable-mode.json
    to: portable-mode.json

# 关键：必须关闭 asar。
# 本项目会 spawn 两个子进程 —— supervisor（dist/supervisor/supervisorMain.js）
# 和 V2 runtime（runtime/dist/main.js）。asar 里的文件不是真实文件，
# 子进程无法执行，会直接报 RUNTIME_NOT_FOUND / supervisor 起不来。
# 关闭 asar 后 resources/app/ 就是普通目录，行为与本机已验证的"解包安装"完全一致。
asar: false
compression: maximum

win:
  target: ["zip"]
  icon: assets/icon-256.png
  artifactName: LinOS-MCP-Portable-${version}-${arch}.${ext}

publish: null
extraMetadata:
  main: dist/main/main.js
