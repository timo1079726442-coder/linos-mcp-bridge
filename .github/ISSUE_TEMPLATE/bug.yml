name: Bug report
about: 报告一个可复现的问题
title: "[bug] "
labels: bug
body:
  - type: input
    id: version
    attributes:
      label: 版本 / commit
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果 vs 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志（请脱敏）
      description: 不要贴令牌、密钥、本机绝对路径
  - type: checkboxes
    id: safe
    attributes:
      label: 确认
      options:
        - label: 我已移除令牌、密钥与个人信息
          required: true
